version: '3.8'

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: clauseguard
      POSTGRES_USER: clauseguard
      POSTGRES_PASSWORD: clauseguard
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clauseguard"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://clauseguard:clauseguard@db:5432/clauseguard
      MODEL_PATH: /app/model
      SBERT_MODEL: sentence-transformers/all-MiniLM-L6-v2
      MAX_FILE_SIZE_MB: 10
      LOG_LEVEL: INFO
    volumes:
      - ./ml/artifacts:/app/model_artifacts:ro

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
